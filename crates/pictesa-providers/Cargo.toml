[package]
name = "pictesa-providers"
description = "Pictesa provider adapters: cloud APIs, gateways and local backends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pictesa-core.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
crc32fast = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A local HTTPS stand-in for provider APIs in the contract tests (tests/common).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
